name: build-libadb
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Build BoringSSL (arm64)
        run: |
          git clone --depth 1 https://boringssl.googlesource.com/boringssl
          cmake -S boringssl -B bssl -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Os -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS="-Os -ffunction-sections -fdata-sections"
          ninja -C bssl crypto

      - name: Build libadb.so
        run: |
          CXX=${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++
          LIBCRYPTO=$(find bssl -name libcrypto.a | head -n1)
          mkdir -p out/arm64-v8a
          $CXX -std=c++17 -Os -fPIC -shared -fno-exceptions -fno-rtti \
            -fvisibility=hidden -ffunction-sections -fdata-sections \
            -Iboringssl/include jni/ino_adb.cpp "$LIBCRYPTO" \
            -o out/arm64-v8a/libadb.so -llog -static-libstdc++ \
            -Wl,--gc-sections -Wl,--strip-all -Wl,--exclude-libs,ALL \
            -Wl,-z,max-page-size=16384
          ls -l out/arm64-v8a/libadb.so
          file out/arm64-v8a/libadb.so

      - uses: actions/upload-artifact@v4
        with:
          name: libadb-arm64-v8a
          path: out/arm64-v8a/libadb.so
